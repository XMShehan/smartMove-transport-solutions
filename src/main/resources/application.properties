spring.application.name=smartmove-backend

# Server
server.port=8080

# Oracle Database
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/xepdb1
spring.datasource.username=SMARTMOVE
spring.datasource.password=${SMARTMOVE_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Keep the existing Oracle schema unchanged
spring.jpa.hibernate.ddl-auto=none

# MongoDB
spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=smartmove_content
spring.mongodb.username=${MONGO_ROOT_USERNAME}
spring.mongodb.password=${MONGO_ROOT_PASSWORD}
spring.mongodb.authentication-database=admin
# Add these lines to the end of src/main/resources/application.properties
# The API uses server-side HTTP sessions for role-aware login.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
